<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kanban-task-management-web-app</title>
    <style>
      /* Keep the initial loading screen aligned with the application theme. */
      #kanban-loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: #f4f7fd;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: sans-serif;
      }
      #kanban-loader-container.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .dark #kanban-loader-container {
        background-color: #20212c;
      }

      .kanban-spinner {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .task-dot {
        width: 14px;
        height: 14px;
        background-color: #635fc7;
        border-radius: 4px;
        animation: wave 1.2s infinite ease-in-out;
      }

      .dot1 {
        animation-delay: -0.32s;
      }
      .dot2 {
        animation-delay: -0.16s;
      }

      .loader-text {
        color: #828fa3;
        font-size: 1rem;
        font-weight: 500;
        direction: rtl;
      }

      .dark .loader-text {
        color: #828fa3;
      }

      @keyframes wave {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.5;
        }
        40% {
          transform: scale(1.2);
          opacity: 1;
        }
      }
    </style>
    <script>
      // Apply the saved theme before rendering to avoid a flash in the wrong mode.
      (function () {
        try {
          const theme = localStorage.getItem("kanban-theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (theme === "dark" || (!theme && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="kanban-loader-container">
      <div class="kanban-spinner">
        <div class="task-dot dot1"></div>
        <div class="task-dot dot2"></div>
        <div class="task-dot dot3"></div>
      </div>
      <p class="loader-text">...Loading the Kanban task application</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
